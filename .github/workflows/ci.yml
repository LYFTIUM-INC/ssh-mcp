name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high || true
      - name: Test
        run: npm test -- --reporter=verbose